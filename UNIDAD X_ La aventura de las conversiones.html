<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNIDAD X: La aventura de las conversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050c1f;--panel:#0d1c3dcc;--line:#1f3a72;--cy:#5ce1ff;--tx:#f4f9ff;--mu:#8fa8d6;--or:#ff8a1f;--ok:#3ddc84;--bad:#ff5a64;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050c1f}}
:root[data-theme="dark"]{--bg:#050c1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.w{width:100%;max-width:560px;margin:auto 0;display:flex;flex-direction:column;gap:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
h1{font-size:clamp(46px,13vw,84px);line-height:.9;margin:0;font-weight:800;letter-spacing:-2px;text-align:center;text-shadow:0 0 30px #5ce1ff88}
h1 b{color:var(--or);text-shadow:0 0 30px #ff8a1faa}
h2{margin:0;font-size:26px}p{margin:0;color:var(--mu);font-size:17px;line-height:1.3}
.sub{text-align:center;font-size:18px}
.btn{font:800 19px 'Baloo 2',sans-serif;color:#04122e;background:var(--cy);border:0;border-radius:16px;padding:14px 18px;box-shadow:0 5px 0 #1d93b3,0 0 24px #5ce1ff44;cursor:pointer;transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 #1d93b3}
.btn.or{background:var(--or);box-shadow:0 5px 0 #b35a08,0 0 24px #ff8a1f55;color:#2a1200}
.btn.gh{background:#16305f;color:var(--tx);box-shadow:0 5px 0 #0b1b3b}
.btn:disabled{background:#26395f;color:#6f84ad;box-shadow:0 5px 0 #17254a;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.card{background:var(--panel);backdrop-filter:blur(14px);border:2px solid var(--line);border-radius:22px;padding:16px}
.hud{display:flex;gap:8px;align-items:center;font-weight:800}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}
.bar{flex:1;height:16px;background:#16305f;border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),#9af0ff);border-radius:99px;transition:width .4s}
.bar.t i{background:linear-gradient(90deg,var(--or),#ffc27a)}
.q{font-size:25px;font-weight:700;line-height:1.15}
.rt{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:19px;background:#07142e;border-radius:14px;padding:10px 14px;border:2px dashed var(--line)}
.rt span:nth-child(3n+2){color:var(--or)}
.opt{font:700 21px 'Baloo 2',sans-serif;color:var(--tx);background:#0f2350;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px;cursor:pointer;text-align:center;width:100%}
.opt.s{border-color:var(--cy);background:#12396a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;font:800 30px 'Baloo 2',sans-serif;text-align:center;color:var(--tx);background:#07142e;border:3px solid var(--line);border-radius:16px;padding:8px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transform:translateY(0);animation:up .3s ease;z-index:5}
@keyframes up{from{transform:translateY(100%)}}
.fb>div{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:#0b3a2a}.fb.no{background:#4a1520}.fb h2{font-size:24px}
.fb.ok h2{color:var(--ok)}.fb.no h2{color:var(--bad)}
.fb.ok .btn{background:var(--ok);box-shadow:0 5px 0 #1b8a4f}
.fb.no .btn{background:var(--bad);box-shadow:0 5px 0 #a02932;color:#fff}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.node{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:#0f2350;color:var(--tx);font:800 20px 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 5px 0 #091a3d;display:grid;place-items:center;line-height:1}
.node small{font-size:12px;color:var(--or)}
.node.cur{border-color:var(--or);animation:pu 1.4s infinite}.node.dn{background:#12396a;border-color:var(--cy)}
.node:disabled{opacity:.4;cursor:not-allowed}
@keyframes pu{50%{box-shadow:0 5px 0 #091a3d,0 0 22px var(--or)}}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center;font-size:30px;font-weight:800}.stat small{display:block;font-size:14px;color:var(--mu);font-weight:500}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx{position:fixed;pointer-events:none;font:800 30px 'Baloo 2';color:var(--or);animation:fl 1s forwards;z-index:9;text-shadow:0 0 14px #ff8a1f}
@keyframes fl{to{transform:translateY(-90px);opacity:0}}
.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="g"></canvas><div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),UI=$('#ui');
const WD=[
{n:'Longitud',e:'📏',c:0x5ce1ff,u:[['mm','cm',10],['cm','m',100],['m','km',1000]],ob:['Cable','Regla','Tira de papel','Cuerda','Tubo'],ex:[[140,0,'Lápiz'],[350,1,'Cinta'],[250,1,'Pizarra'],[4500,2,'Distancia de entrenamiento']]},
{n:'Masa',e:'⚖️',c:0x7cffb2,u:[['mg','g',1000],['g','kg',1000],['mg','g',1000]],ob:['Polvo','Fruta','Cristales','Semillas','Paquete'],ex:[[3200,0,'Muestra de laboratorio'],[2800,1,'Mochila']]},
{n:'Tiempo',e:'⏱️',c:0xb89cff,u:[['s','min',60],['min','h',60],['h','d',24]],ob:['Película','Clase','Viaje','Ensayo','Práctica'],ex:[[420,0,'Experimento'],[7200,0,'Reacción lenta']]},
{n:'Capacidad',e:'🧪',c:0xff8a1f,u:[['mL','L',1000],['mL','L',1000],['mL','L',1000]],ob:['Solución','Jarra','Frasco','Tanque','Mezcla'],ex:[[3500,0,'Preparación']]}];
const KS=[0.5,1.5,2.5,3.5,4.2,7,12,6.5,9,2,4.5,8];
let S;const def={xp:0,coins:0,streak:0,day:'',d:{},badges:[],snd:true,theme:0};
try{S={...def,...JSON.parse(localStorage.getItem('ux')||'{}')}}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem('ux',JSON.stringify(S))}catch(e){}};
const lvl=()=>Math.floor(S.xp/100)+1,fmt=n=>String(+n.toFixed(3)).replace('.',',');
const st=(w,m)=>(S.d[w]||[])[m]||0;
const wOpen=w=>w==0||st(w-1,3)>0, mOpen=(w,m)=>wOpen(w)&&(m==0||st(w,m-1)>0);
const rnd=a=>a[Math.random()*a.length|0],shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
/* AUDIO */
let AC,pad;
function snd(a,b,d=.15,t='triangle'){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(a,AC.currentTime);o.frequency.exponentialRampToValueAtTime(b,AC.currentTime+d);g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.05);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.06);
if(!pad){pad=[110,165,220].map((f,i)=>{const p=AC.createOscillator(),q=AC.createGain();p.type='sine';p.frequency.value=f;q.gain.value=.012;p.connect(q).connect(AC.destination);p.start();return q})}}catch(e){}
pad&&pad.forEach(q=>q.gain.value=S.snd?.012:0)}
const okS=()=>{snd(520,880,.14);setTimeout(()=>snd(880,1320,.18),120)},noS=()=>snd(260,110,.3,'sawtooth'),clk=()=>snd(400,500,.05);
/* 3D */
let sc,cam,ren,bot,knot,ring,pts,lights=[],mx=0,my=0,hop=0,shk=0,accent=new THREE.Color(0x5ce1ff);
try{
ren=new THREE.WebGLRenderer({canvas:$('#g'),antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
sc=new THREE.Scene();sc.background=new THREE.Color(0x050c1f);sc.fog=new THREE.FogExp2(0x050c1f,.045);
cam=new THREE.PerspectiveCamera(55,1,.1,100);cam.position.set(0,1.6,7);
sc.add(new THREE.AmbientLight(0x4466aa,.6));
[[-5,4,3,0x5ce1ff],[5,2,2,0xff8a1f]].forEach(l=>{const p=new THREE.PointLight(l[3],1.6,22);p.position.set(l[0],l[1],l[2]);sc.add(p);lights.push(p)});
const fl=new THREE.GridHelper(60,60,0x5ce1ff,0x16305f);fl.position.y=-2;sc.add(fl);
const fm=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x07142e,metalness:.9,roughness:.25}));fm.rotation.x=-Math.PI/2;fm.position.y=-2.02;sc.add(fm);
knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.6,.28,160,24),new THREE.MeshStandardMaterial({color:0x5ce1ff,metalness:.9,roughness:.2,emissive:0x0a3a5a}));knot.position.set(0,.6,-6);sc.add(knot);
ring=new THREE.Mesh(new THREE.IcosahedronGeometry(3.4,1),new THREE.MeshBasicMaterial({color:0x5ce1ff,wireframe:true,transparent:true,opacity:.22}));ring.position.copy(knot.position);sc.add(ring);
for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.3),new THREE.MeshBasicMaterial({color:i%2?0xff8a1f:0x5ce1ff,transparent:true,opacity:.18,side:2}));m.position.set((i-2)*3.6,1+Math.sin(i)*1.5,-9);m.userData.p=i;sc.add(m)}
const pg=new THREE.BufferGeometry(),pa=new Float32Array(900);for(let i=0;i<900;i++)pa[i]=(Math.random()-.5)*(i%3==1?12:30);pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.06,transparent:true,opacity:.8}));sc.add(pts);
bot=new THREE.Group();const mt=c=>new THREE.MeshStandardMaterial({color:c,metalness:.6,roughness:.3});
const body=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.SphereGeometry(.6,32,24):new THREE.SphereGeometry(.6,32,24),mt(0xeaf4ff));body.scale.set(1,1.15,1);bot.add(body);
const vis=new THREE.Mesh(new THREE.SphereGeometry(.42,32,16,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x04122e,emissive:0x0a2a55,metalness:1,roughness:.1}));vis.rotation.x=1.35;vis.position.set(0,.2,.3);bot.add(vis);
[-.17,.17].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.07),new THREE.MeshBasicMaterial({color:0x5ce1ff}));e.position.set(x,.3,.62);bot.add(e)});
const an=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.4),mt(0x889ab8));an.position.y=.95;bot.add(an);
const ba=new THREE.Mesh(new THREE.SphereGeometry(.1),new THREE.MeshBasicMaterial({color:0xff8a1f}));ba.position.y=1.2;bot.add(ba);
const bel=new THREE.Mesh(new THREE.TorusGeometry(.62,.06,12,40),mt(0xff8a1f));bel.rotation.x=Math.PI/2;bel.position.y=-.2;bot.add(bel);
sc.add(bot);
const rs=()=>{ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();bot.position.set(innerWidth>innerHeight?3.4:1.6,-.9,innerWidth>innerHeight?1:0);bot.scale.setScalar(innerWidth>innerHeight?1.3:.8)};
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const clock=new THREE.Clock(),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),k=rm?.2:1;
knot.rotation.x=t*.3*k;knot.rotation.y=t*.4*k;ring.rotation.y=-t*.15*k;ring.rotation.x=t*.08*k;
pts.rotation.y=t*.01*k;
sc.children.forEach(o=>{if(o.userData.p!==undefined)o.position.y=1+Math.sin(t*.6+o.userData.p)*1.3});
hop=Math.max(0,hop-.04);shk=Math.max(0,shk-.04);
bot.position.y=-.9+Math.sin(t*2)*.12+Math.sin(hop*Math.PI)*1.1;bot.rotation.y=Math.sin(t)*.3+(innerWidth>innerHeight?-.5:0);bot.rotation.z=Math.sin(shk*30)*shk*.5;
knot.material.color.lerp(accent,.05);ring.material.color.lerp(accent,.05);lights[0].color.lerp(accent,.05);
cam.position.x+=(mx*1.2-cam.position.x)*.04;cam.position.y+=(1.6-my*.8-cam.position.y)*.04;cam.lookAt(0,0,0);ren.render(sc,cam)})();
}catch(e){document.body.style.background='radial-gradient(circle at 50% 30%,#0d2a5a,#050c1f)'}
const setAcc=w=>accent.set(WD[w]?WD[w].c:0x5ce1ff);
const fx=(t,x,y)=>{const d=document.createElement('div');d.className='fx';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)};
/* SCREENS */
const hudTop=()=>`<div class="hud"><span class="chip">⭐ Nv ${lvl()}</span><span class="chip">🔥 ${S.streak}</span><span class="chip">⚡ ${S.xp}</span><span class="chip">🪙 ${S.coins}</span></div>`;
function menu(){setAcc(-1);const has=Object.keys(S.d).length>0;
UI.innerHTML=`<div class="w"><div class="sub" style="color:var(--or);font-weight:800">Laboratorio de conversiones</div><h1>UNIDAD <b>X</b></h1><p class="sub">La aventura de las conversiones</p>${hudTop()}
<button class="btn or" onclick="worlds()">JUGAR</button><button class="btn" ${has?'':'disabled'} onclick="worlds(1)">CONTINUAR</button>
<div class="row"><button class="btn gh" onclick="lab()">LABORATORIO</button><button class="btn gh" onclick="help()">INSTRUCCIONES</button></div>
<div class="row"><button class="btn gh" onclick="ach()">LOGROS</button><button class="btn gh" onclick="cfg()">CONFIGURACIÓN</button></div></div>`}
function worlds(cont){clk();let h='';WD.forEach((w,i)=>{const o=wOpen(i),done=st(i,3)>0;
h+=`<div class="card"><h2>${w.e} Mundo ${i+1}: ${w.n} ${o?'':'🔒'}</h2><p>${w.u.map(u=>u[0]+' → '+u[1]).filter((v,j,a)=>a.indexOf(v)==j).join(' · ')}</p><div class="map" style="margin-top:10px">`;
for(let m=0;m<4;m++){const s=st(i,m),op=mOpen(i,m);h+=`<button class="node ${s?'dn':op?'cur':''}" ${op?'':'disabled'} onclick="play(${i},${m})">${m<3?m+1:'🏆'}<small>${s?'★'.repeat(s):op?(m<3?'Misión':'Final'):'🔒'}</small></button>`}
h+='</div></div>'});
UI.innerHTML=`<div class="w">${hudTop()}${h}<button class="btn gh" onclick="menu()">VOLVER</button></div>`}
let G;
function play(w,m){clk();setAcc(w);const today=new Date().toDateString();
if(S.day!=today){S.streak=(S.day==new Date(Date.now()-864e5).toDateString())?S.streak+1:1;S.day=today;save()}
const fin=m==3,n=fin?8:5,W=WD[w],qs=[];const T=['mc','in','eq','in','mc','in','eq','in'];
for(let i=0;i<n;i++){const u=fin?rnd(W.u):W.u[m%W.u.length],[f,t,fa]=u,ex=i==0&&!fin?W.ex.find(e=>W.u[e[1]]==u||W.u[e[1]].join()==u.join()):0;
const k=ex?ex[0]/fa:rnd(KS),v=ex?ex[0]:k*fa,nm=ex?ex[2]:rnd(W.ob);
const ty=fin&&i%2?'mc':T[i];let q={f,t,fa,k,v,nm,ty,ex:`${fa} ${f} = 1 ${t}<br>${fmt(v)} ${f} = X<br>X = (${fmt(v)} × 1) ÷ ${fa} = <b>${fmt(k)} ${t}</b>`};
if(ty=='mc'){q.o=shuf([k,k*10,k/10,k*100].map(x=>fmt(x)+' '+t));q.a=fmt(k)+' '+t}
if(ty=='eq'){q.o=shuf([`${fa} ${f} = 1 ${t}`,`${fa*10} ${f} = 1 ${t}`,`1 ${f} = ${fa} ${t}`,`${fa/2} ${f} = 1 ${t}`]);q.a=`${fa} ${f} = 1 ${t}`;q.ex=`La equivalencia del material es ${fa} ${f} = 1 ${t}. Las unidades menores necesitan muchas para formar una mayor.`}
qs.push(q)}
G={w,m,qs,i:0,ok:0,no:0,t0:Date.now(),xp:0,co:0,run:0,sel:null,fin};question()}
let tmr;
function question(){clearInterval(tmr);const q=G.qs[G.i];G.sel=null;G.done=0;
let body='';
if(q.ty=='mc'||q.ty=='eq')body=`<div class="opts">${q.o.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${o}</button>`).join('')}</div>`;
else body=`<input id="in" inputmode="decimal" autocomplete="off" placeholder="X = ?" oninput="G.sel=this.value.trim();$('#ck').disabled=!G.sel" onkeydown="if(event.key=='Enter'&&G.sel)check()"><p class="sub">Escribe el resultado en ${q.t}. Puedes usar decimales.</p>`;
const prompt=q.ty=='eq'?'¿Cuál es la equivalencia correcta?':`${q.nm}: ${fmt(q.v)} ${q.f}. ¿Cuántos ${q.t} son?`;
UI.innerHTML=`<div class="w"><div class="hud"><button class="chip" style="color:var(--tx);font:800 18px 'Baloo 2'" onclick="menu()" aria-label="Salir">✕</button><div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div><span class="chip">🔥 ${G.run}</span></div>
${G.fin?`<div class="bar t"><i id="tb" style="width:100%"></i></div>`:''}
<div class="card"><div class="q">${prompt}</div></div>
${q.ty=='eq'?'':`<div class="rt"><span>${q.fa} ${q.f}</span><span>=</span><span>1 ${q.t}</span><span>${fmt(q.v)} ${q.f}</span><span>=</span><span>X</span></div>`}
${body}<button id="ck" class="btn" disabled onclick="check()">COMPROBAR</button></div>`;
if(q.ty=='in')setTimeout(()=>{const e=$('#in');e&&e.focus()},350);
if(G.fin){let t0=Date.now();tmr=setInterval(()=>{const p=1-(Date.now()-t0)/20000;const b=$('#tb');if(b)b.style.width=Math.max(p,0)*100+'%';if(p<=0){clearInterval(tmr);if(!G.done)check(1)}},100)}}
function pick(j,el){if(G.done)return;clk();G.sel=G.qs[G.i].o[j];document.querySelectorAll('.opt').forEach(o=>o.classList.remove('s'));el.classList.add('s');$('#ck').disabled=false}
function check(timeout){if(G.done)return;G.done=1;clearInterval(tmr);const q=G.qs[G.i];let good=false;
if(!timeout){if(q.ty=='in'){const v=parseFloat(String(G.sel).replace(',','.'));good=Math.abs(v-q.k)<.001}else good=G.sel==q.a}
const b=$('#ck');if(b)b.style.display='none';
const bonus=G.run>=2&&good?5:0;
if(good){G.ok++;G.run++;G.xp+=10+bonus;G.co+=5;okS();hop=1;fx('+'+(10+bonus)+' XP',innerWidth/2-40,innerHeight-190);if(G.run==5)badge('Racha de 5')}
else{G.no++;G.run=0;noS();shk=1;UI.firstChild.classList.add('shake')}
const d=document.createElement('div');d.className='fb '+(good?'ok':'no');
d.innerHTML=`<div><h2>${good?rnd(['¡Excelente!','¡Correcto!','¡Perfecto!','¡Muy bien!']):(timeout?'Se acabó el tiempo':'Casi. Mira cómo se resuelve')}</h2>${good?'':`<p style="color:#ffd9dc">${q.ex}</p>`}<button class="btn" onclick="this.closest('.fb').remove();next()">CONTINUAR</button></div>`;
document.body.appendChild(d)}
function next(){G.i++;G.i<G.qs.length?question():results()}
function badge(n){if(!S.badges.includes(n)){S.badges.push(n);save();fx('🏅 '+n,innerWidth/2-70,innerHeight/2)}}
function results(){clearInterval(tmr);const n=G.qs.length,acc=Math.round(G.ok/n*100),stars=acc==100?3:acc>=80?2:acc>=60?1:0,secs=Math.round((Date.now()-G.t0)/1000);
const pass=stars>0,bonusC=stars*10;G.co+=pass?bonusC:0;if(pass)G.xp+=20;
S.xp+=G.xp;S.coins+=G.co;S.d[G.w]=S.d[G.w]||[0,0,0,0];S.d[G.w][G.m]=Math.max(S.d[G.w][G.m],stars);
if(G.ok>=1)badge('Primer paso');if(acc==100)badge('Misión perfecta');if(G.fin&&pass)badge('Maestro de '+WD[G.w].n);save();pass?(okS(),hop=1):noS();
UI.innerHTML=`<div class="w"><h1 style="font-size:44px">${pass?'¡Misión superada!':'Inténtalo otra vez'}</h1><div class="sub" style="font-size:54px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
<div class="card g3"><div class="stat" style="color:var(--ok)">${G.ok}<small>Correctas</small></div><div class="stat" style="color:var(--bad)">${G.no}<small>Incorrectas</small></div><div class="stat">${acc}%<small>Precisión</small></div><div class="stat">+${G.xp}<small>XP</small></div><div class="stat">+${G.co}<small>Monedas</small></div><div class="stat">${secs}s<small>Tiempo</small></div></div>
${G.fin&&pass&&G.w<3?`<p class="sub">🔓 Nuevo laboratorio desbloqueado: Mundo ${G.w+2}</p>`:''}
<button class="btn" onclick="play(${G.w},${G.m})">REPETIR</button><button class="btn or" onclick="${pass&&G.m<3?`play(${G.w},${G.m+1})`:'worlds()'}">CONTINUAR</button></div>`}
function lab(){clk();UI.innerHTML=`<div class="w"><h2>Laboratorio</h2><p>Cada mundo superado abre un laboratorio. Toca uno para cambiar la iluminación.</p>${WD.map((w,i)=>`<button class="btn ${wOpen(i)?'':''} gh" ${wOpen(i)?'':'disabled'} onclick="setAcc(${i});clk()">${w.e} Laboratorio de ${w.n} ${wOpen(i)?'':'🔒'}</button>`).join('')}<div class="card g3"><div class="stat">${lvl()}<small>Nivel</small></div><div class="stat">${S.xp}<small>XP</small></div><div class="stat">${S.streak}<small>Racha diaria</small></div></div><div class="bar"><i style="width:${S.xp%100}%"></i></div><button class="btn" onclick="menu()">VOLVER</button></div>`}
function help(){clk();UI.innerHTML=`<div class="w"><h2>Instrucciones</h2><div class="card"><p>Convierte de unidades menores a mayores con la regla de tres.</p><div class="rt" style="margin:10px 0"><span>100 cm</span><span>=</span><span>1 m</span><span>350 cm</span><span>=</span><span>X</span></div><p>X = (350 × 1) ÷ 100 = <b style="color:var(--or)">3,5 m</b></p><p style="margin-top:10px">Equivalencias: 10 mm = 1 cm · 100 cm = 1 m · 1000 m = 1 km · 1000 mg = 1 g · 1000 g = 1 kg · 60 s = 1 min · 60 min = 1 h · 3600 s = 1 h · 1000 mL = 1 L</p><p style="margin-top:10px">Cada mundo tiene 3 misiones y una prueba final contrarreloj de 20 segundos por pregunta. Necesitas al menos 60% de precisión para avanzar.</p></div><button class="btn" onclick="menu()">VOLVER</button></div>`}
function ach(){clk();const all=['Primer paso','Racha de 5','Misión perfecta',...WD.map(w=>'Maestro de '+w.n)];UI.innerHTML=`<div class="w"><h2>Logros</h2>${all.map(b=>`<div class="card" style="opacity:${S.badges.includes(b)?1:.4}">${S.badges.includes(b)?'🏅':'🔒'} ${b}</div>`).join('')}<button class="btn" onclick="menu()">VOLVER</button></div>`}
function cfg(){clk();UI.innerHTML=`<div class="w"><h2>Configuración</h2><button class="btn gh" onclick="S.snd=!S.snd;save();snd(500,700);cfg()">Sonido y música: ${S.snd?'activados':'desactivados'}</button><button class="btn gh" onclick="if(confirm('¿Borrar todo el progreso?')){S={...def};save();menu()}">Borrar progreso</button><button class="btn" onclick="menu()">VOLVER</button></div>`}
menu();
</script></body></html>
